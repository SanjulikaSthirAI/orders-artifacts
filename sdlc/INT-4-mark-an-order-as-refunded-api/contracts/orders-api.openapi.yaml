openapi: 3.1.0
info:
  title: Orders API
  version: 1.1.0
paths:
  /orders:
    get:
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{order_id}:
    get:
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{order_id}/cancel:
    post:
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: The order is no longer cancellable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{order_id}/refunds:
    post:
      summary: Refund an order
      operationId: refund_order_orders__order_id__refunds_post
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No such order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The order cannot be refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Order:
      properties:
        refunded:
          type: boolean
          title: Refunded
        refund_time:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Refund Time
      type: object
      required:
        - refunded
    Error:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
        - detail
      title: Error
    HTTPValidationError:
      type: object
