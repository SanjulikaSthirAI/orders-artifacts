# review/rubric.yaml: the G4 quality gate (CD-08). Keep this file in the artifact repo as a PROTECTED file:
#   - CODEOWNERS: the Solution Architect and the Tech lead own `review/`;
#   - changes only by pull request, never by the coding agent or the orchestrator's own commits.
# The orchestrator reads it from the artifact repo's base branch at every review and records its version and
# sha256 in each gate record (RUB-n). Bump `version` on every change.
#
# Layer 1 `checks` are decided by code, pass or fail, for the exact commit. Any failure goes to repair.
# Layer 2 `questions` are exactly two, Intent and Security, each answered Pass or Fail by a reviewer in a fresh
# context. Both must pass. An uncited answer fails by code. A Fail's reason is the repair instruction.
# No weights, scores, bar or floors (withdrawn by CD-08). Style notes are advisory PR comments only.
version: 2
checks:
  - id: L1
    name: Every acceptance criterion of the story has an Intent Test
    check: ac_tests_exist
  - id: L2
    name: The tests ran on this commit and passed
    check: tests_passed
    evidence_checks: [tests]   # CI run 1 (push) checks that must be `success` for the head SHA
  - id: L3
    name: No protected contract changed, unless the story is marked as a contract change
    check: protected_contract_unchanged
  - id: L4
    name: Every changed file is inside the story's planned files
    check: planned_files_scope
    allow: ["tests/**"]        # any story may add its own tests
questions:
  - id: Q1
    owner: intent
    name: Intent
    ask: >-
      For every acceptance criterion, followed from the real request through every state change: does the code do
      what the criterion means, including its negative and error cases? Pass only if every criterion is met, each
      with the file:line where the behaviour is decided.
  - id: Q2
    owner: security
    name: Security
    ask: >-
      Against the project guardrails: authorisation, input validation, no secrets, no injection, idempotency and
      audit where money or state moves. Pass only if no guardrail is violated, citing the file:line you checked.
